name: Deploy API to MonsterASP

# Every push to main builds the API and uploads it to wahspices.runasp.net over SFTP.
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_PASSWORD, DB_CONNECTION, JWT_SECRET, DATA_ENCRYPTION_KEY, EMAIL_PASSWORD
#   optional: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET (leave unset = online payments off, COD only)
# Variables (same page → Variables), all optional:
#   FTP_HOST (default site110448.siteasp.net), FTP_USER (default site110448),
#   FRONTEND_URL (default https://wahspices.com), ASSET_BASE_URL (default https://wahspices.runasp.net)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-monsterasp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: |
          dotnet publish WahSpices.API/WahSpices.API.csproj -c Release -o publish
          # MonsterASP is Windows: drop Linux/macOS/ARM native libraries (~65 MB) to keep the upload small.
          find publish/runtimes -mindepth 1 -maxdepth 1 ! -name win ! -name win-x86 ! -name win-x64 -exec rm -rf {} +
          du -sh publish

      - name: Add production settings to web.config
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          DATA_ENCRYPTION_KEY_ID: k1
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://wahspices.com' }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL || 'https://wahspices.runasp.net' }}
        run: python3 .github/scripts/inject_env.py publish/web.config

      - name: Upload to MonsterASP (SFTP)
        env:
          FTP_HOST: ${{ vars.FTP_HOST || 'site110448.siteasp.net' }}
          FTP_USER: ${{ vars.FTP_USER || 'site110448' }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$LFTP_PASSWORD" || { echo "FTP_PASSWORD secret is missing"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          echo '<html><body>Updating WAH! Spices API, back in a minute.</body></html>' > app_offline.htm
          # app_offline.htm stops the app so its DLLs are not locked; mirror never deletes server-only
          # files (Logs, uploaded images), it only adds/overwrites what the build produced.
          # appsettings*.json are never uploaded: the server keeps its own copy with the real values.
          lftp --env-password -u "$FTP_USER" "sftp://$FTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            put app_offline.htm -o wwwroot/app_offline.htm;
            mirror --reverse --parallel=4 --verbose=1 --exclude-glob appsettings*.json publish/ wwwroot/;
            rm -f wwwroot/app_offline.htm;
            bye"

      - name: Check the site is up
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://wahspices.runasp.net/health || true)
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Site did not answer 200 on /health — check MonsterASP logs (wwwroot/Logs)."
          exit 1
